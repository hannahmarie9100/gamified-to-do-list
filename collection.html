<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <title>Collection</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik+Puddles&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>

    <div class="app">
      <header class="app-header">
        <h1 class="rubik-puddles-regular">Collection</h1>
        <p class="open-sans-variable">
          Finish more tasks to collect more animals!
        </p>
      </header>

      <a href="index.html" class="nav-btn">← Back to Tasks</a>

        <section class="rewards-section">
            <h2>Your Collection</h2>
            <div id="rewardItems" class="reward-items">
            <!-- Reward items will be dynamically added here -->
            </div>

        <footer class="app-footer"> 
            <small>Gamified To-Do - 2025</small>
        </footer>

    </div>


    <div id="rewardToast" class="reward-toast" aria-live="polite">  </div>

    <button id="resetRewardsBtn" class="reset-btn">Reset Collection</button>


    <script src="scripts.js"></script>

  </body>
</html>

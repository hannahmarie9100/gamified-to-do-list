<!-- 
    This is the main page strcucture for the website
    loads CSS, Java script, and contains all user interface elements
-->

<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <title>Gamified To-Do List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik+Puddles&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chewy&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Rubik+Puddles&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="WIP-banner">
      <p>🚧 Work In Progress - New Features Coming Soon! 🚧</p>
    </div>

    <div class="app">
      <header class="app-header">
        <h1 class="rubik-puddles-regular">Gamified To-Do List</h1>
        <p class="open-sans-variable">Complete tasks to earns rewards!</p>
      </header>

      <a href="collection.html" class="nav-btn">← Your Collection</a>

      <div class="two-col">
        <section class="timer-section">
          <h2>Focus Timer</h2>
          <p>00:00</p>
        </section>

        <section class="add-task-section">
          <h2>Add New Task</h2>

          <div class="task-inputs">
            <input id="taskInput" type="text" placeholder="Enter task: " />
            <button id="addTaskBtn">Add Task</button>
          </div>

          <ul id="tasks-list">
            <!-- Tasks will be dynamically added here -->
          </ul>
        </section>
      </div>

      <footer class="app-footer">
        <small>Gamified To-Do - 2025</small>
      </footer>
    </div>
  </body>
</html>
